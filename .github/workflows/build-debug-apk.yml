name: Build Personal Cinema Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project or extract ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)
            if [ -z "$ZIP_FILE" ]; then
              echo "No settings.gradle.kts or .zip archive found."
              exit 1
            fi
            echo "Extracting $ZIP_FILE..."
            mkdir -p _extracted
            unzip -q "$ZIP_FILE" -d _extracted
            SETTINGS_PATH=$(find _extracted -type f -name "settings.gradle.kts" | head -n 1 || true)
            if [ -z "$SETTINGS_PATH" ]; then
              echo "Could not find settings.gradle.kts inside $ZIP_FILE."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure debug.keystore exists
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-cinema-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
